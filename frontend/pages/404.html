<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Aryana Currency.">
  <meta name="theme-color" content="#101b30">

  <title>Page Not Found | ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/notifications.css">
</head>
<body>

  <div style="min-height:100vh; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 30%, rgba(198,165,104,.08), transparent 50%), var(--bg); padding:30px;">

    <div style="max-width:560px; text-align:center;">

      <!-- Logo -->
      <a href="../index.html" style="display:inline-flex; align-items:center; gap:12px; text-decoration:none; margin-bottom:35px;">
        <img src="../assets/images/logo.png" alt="ARYANA CURRENCY" width="52" height="52" style="border-radius:13px;">
        <div style="text-align:start;">
          <div class="brand-name" style="font-size:14px;">ARYANA CURRENCY</div>
          <div class="brand-subtitle" data-i18n="brandSubtitle">DIGITAL EXCHANGE</div>
        </div>
      </a>

      <!-- 404 -->
      <div style="font-family:'Manrope',sans-serif; font-size:clamp(90px, 20vw, 180px); font-weight:800; line-height:1; letter-spacing:-8px; background:linear-gradient(135deg, var(--gold), #8a6b30); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:10px;">
        404
      </div>

      <h1 style="font-family:'Manrope',sans-serif; font-size:clamp(22px, 3vw, 30px); font-weight:800; letter-spacing:-.5px; margin-bottom:14px;" data-i18n="notFoundTitle">
        Page not found
      </h1>

      <p style="color:var(--muted); font-size:14px; line-height:1.8; margin-bottom:32px;" data-i18n="notFoundText">
        The page you're looking for doesn't exist or has been moved.
      </p>

      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <a href="../index.html" class="btn btn-gold" style="padding:12px 24px;">
          <span data-i18n="notFoundHome">Go home</span>
        </a>
        <a href="dashboard.html" class="btn btn-outline-dark" style="padding:12px 24px;">
          <span data-i18n="notFoundDashboard">My dashboard</span>
        </a>
      </div>

    </div>

  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/animations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Theme.init();
      const lang = I18N.detectInitialLang();
      await I18N.load(lang);
      I18N.apply();
    });
  </script>
</body>
</html>
