<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Aryana Currency password.">
  <meta name="theme-color" content="#0B0E11">

  <title>Reset Password | ARYANA CURRENCY</title>

<script>
  (function() {
    try {
      var saved = localStorage.getItem('aryana_theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../assets/css/auth-v2.css">
  <link rel="stylesheet" href="../assets/css/notifications.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
</head>
<body>

  <div class="auth-page">

    <main class="auth-form-panel">
      <div class="auth-form-container">

        <div class="auth-form-header">
          <div class="section-kicker">NEW PASSWORD</div>
          <h1>Set new password</h1>
          <p>Choose a strong password for your account.</p>
        </div>

        <div class="alert alert-danger" id="errorBox" style="display:none;"></div>
        <div class="alert alert-success" id="successBox" style="display:none;"></div>

        <form class="auth-form" id="resetForm" novalidate>

          <div class="field">
            <label class="field-label" for="password">New password</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="password"
                class="field-input"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
              >
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"></button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="passwordConfirm">Confirm password</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="passwordConfirm"
                class="field-input"
                placeholder="Repeat password"
                autocomplete="new-password"
                minlength="8"
                required
              >
              <button type="button" class="password-toggle" id="passwordConfirmToggle" aria-label="Show password"></button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span>Reset password</span>
          </button>

        </form>

        <p class="auth-terms">
          Remember your password?
          <a href="login.html">Back to login</a>
        </p>

      </div>
    </main>

    <aside class="auth-brand-panel">
      <div class="auth-brand-top">
        <a href="../index.html" class="app-brand">
          <img src="../assets/images/logo.png" alt="ARYANA CURRENCY">
          <div class="app-brand-text">
            ARYANA
            <small>CURRENCY</small>
          </div>
        </a>
      </div>

      <div class="auth-brand-content">
        <h2 class="auth-brand-title">
          Almost there,<br>
          <span class="gold">just one step.</span>
        </h2>

        <p class="auth-brand-subtitle">
          Your new password will be active immediately.
        </p>

        <div class="auth-trust" style="margin-top: 40px;">
          <div class="auth-trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Encrypted
          </div>
          <div class="auth-trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Protected
          </div>
          <div class="auth-trust-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Instant
          </div>
        </div>
      </div>

      <div class="auth-brand-footer">
        © <span id="currentYear"></span> ARYANA CURRENCY
      </div>
    </aside>

  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/form-helpers.js"></script>
  <script src="../assets/js/reset-password.js"></script>
</body>
</html>
