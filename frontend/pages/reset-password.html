<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Set a new password for your Aryana account">
  <meta name="theme-color" content="#FAFBFF">

  <title>Reset Password | ARYANA CURRENCY</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aryana_theme') || 'light';
        document.documentElement.classList.add(saved);
        document.documentElement.setAttribute('data-theme', saved);
        setTimeout(function () {
          document.documentElement.classList.add('theme-ready');
        }, 50);
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aryana">
  <link rel="apple-touch-icon" href="../assets/images/icon-192.png">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../assets/css/notifications.css">
  <link rel="stylesheet" href="../assets/css/auth-v2.css">
</head>
<body class="auth-body">

  <div class="auth-card">

    <!-- ═══════════════════════════════════════
         BRAND HEADER
         ═══════════════════════════════════════ -->
    <div class="auth-brand">
      <a href="../index.html" class="auth-brand-logo">
        <img src="../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="auth-brand-logo-text">
          <strong>ARYANA</strong>
          <small>CURRENCY</small>
        </div>
      </a>

      <div class="auth-badge">
        <span class="auth-badge-dot"></span>
        <span>New Password</span>
      </div>

      <h1 class="auth-title">
        Set New <span class="highlight">Password</span>
      </h1>
      <p class="auth-subtitle">
        Choose a strong password for your account.
      </p>
    </div>

    <!-- ═══════════════════════════════════════
         FORM
         ═══════════════════════════════════════ -->
    <div class="auth-form-wrap">

      <!-- Error Box -->
      <div class="auth-alert auth-alert-error" id="errorBox" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText">Something went wrong</span>
      </div>

      <!-- Success Box -->
      <div class="auth-alert auth-alert-success" id="successBox" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="successText">Password changed successfully</span>
      </div>

      <form class="auth-form" id="resetForm" novalidate>

        <div class="auth-field">
          <label class="auth-label" for="password">New Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="password"
              class="auth-input"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button type="button" class="auth-input-toggle" id="togglePassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="passwordConfirm">Confirm Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="passwordConfirm"
              class="auth-input"
              placeholder="Repeat password"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button type="button" class="auth-input-toggle" id="togglePasswordConfirm" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit-btn" id="submitBtn">
          <span>Reset Password</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>

    </div>

    <!-- ═══════════════════════════════════════
         FOOTER
         ═══════════════════════════════════════ -->
    <div class="auth-footer">
      <div class="auth-footer-text">
        Remember your password? <a href="login.html">Back to Sign In</a>
      </div>
    </div>

  </div>

  <!-- Legal -->
  <div class="auth-legal">
    <span>© 2026 ARYANA CURRENCY</span>
    <span>·</span>
    <a href="terms.html">Terms</a>
    <span>·</span>
    <a href="privacy.html">Privacy</a>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/form-helpers.js"></script>
  <script src="../assets/js/reset-password.js"></script>
</body>
</html>
