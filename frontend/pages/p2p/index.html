<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="P2P Trading — Traders By Traders | Aryana Currency">
  <meta name="theme-color" content="#0B0E11">

  <title>P2P Trading | ARYANA CURRENCY</title>

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('aryana_theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- PWA -->
  <link rel="manifest" href="../../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aryana">
  <link rel="apple-touch-icon" href="../../assets/images/icon-192.png">
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
  <link rel="stylesheet" href="../../assets/css/footer.css">
  <link rel="stylesheet" href="../../assets/css/pwa.css">
  <link rel="stylesheet" href="../../assets/css/p2p.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="container app-header-inner">

      <a href="../dashboard.html" class="app-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="app-brand-text">
          ARYANA
          <small>CURRENCY</small>
        </div>
      </a>

      <nav class="app-nav">
        <a href="../dashboard.html" class="app-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Dashboard</span>
        </a>
        <a href="../exchange.html" class="app-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/>
          </svg>
          <span>Trade</span>
        </a>
        <a href="index.html" class="app-nav-link active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>P2P</span>
        </a>
        <a href="../orders.html" class="app-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span>Orders</span>
        </a>
        <a href="../profile.html" class="app-nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span>Profile</span>
        </a>
      </nav>

      <div class="app-header-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>

        <a href="../profile.html" class="user-avatar-btn">
          <div class="user-avatar" id="userAvatar">A</div>
          <span class="user-name" id="userName">User</span>
        </a>

        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main -->
  <main class="container p2p-main">

    <!-- Page Header -->
    <div class="p2p-page-header">
      <a href="../dashboard.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </a>
      <div>
        <h1>Traders By Traders</h1>
        <p>Trade USDT directly with other users</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="p2p-tabs">
      <button class="p2p-tab active" data-side="BUY">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <polyline points="19 12 12 19 5 12"/>
        </svg>
        Buy USDT
      </button>
      <button class="p2p-tab" data-side="SELL">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
        Sell USDT
      </button>
    </div>

    <!-- Actions Row -->
    <div class="p2p-actions-row">
      <button class="p2p-filter-btn" id="filterBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        Filters
      </button>

      <a href="my-orders.html" class="p2p-filter-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        My Orders
      </a>

      <a href="create-ad.html" class="p2p-create-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Create Ad
      </a>
    </div>

    <!-- Stats Row -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="p2p-summary-box" style="margin: 0; text-align: center;">
        <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Active Ads</div>
        <div style="font-size: 20px; font-weight: 800; color: var(--gold); font-family: var(--font-mono);" id="statAds">0</div>
      </div>
      <div class="p2p-summary-box" style="margin: 0; text-align: center;">
        <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Completed Trades</div>
        <div style="font-size: 20px; font-weight: 800; color: var(--green); font-family: var(--font-mono);" id="statTrades">0</div>
      </div>
      <div class="p2p-summary-box" style="margin: 0; text-align: center;">
        <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Volume (USDT)</div>
        <div style="font-size: 20px; font-weight: 800; color: var(--text-primary); font-family: var(--font-mono);" id="statVolume">0</div>
      </div>
    </div>

    <!-- Alert -->
    <div class="p2p-alert info" style="margin-bottom: 20px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span>All trades are secured by ARYANA escrow. Your funds are protected until trade completion.</span>
    </div>

    <!-- Ads List -->
    <div id="adsContainer">
      <div class="p2p-loading">
        <div class="p2p-spinner"></div>
        <span>Loading ads...</span>
      </div>
    </div>

  </main>

  <!-- Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/p2p.js"></script>
  <script src="../../assets/js/footer.js"></script>
  <script src="../../assets/js/pwa.js"></script>
</body>
</html>
