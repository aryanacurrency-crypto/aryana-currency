<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Ads | P2P — ARYANA CURRENCY</title>
  <meta name="theme-color" content="#0B0E11">

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('aryana_theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
  <link rel="stylesheet" href="../../assets/css/footer.css">
  <link rel="stylesheet" href="../../assets/css/pwa.css">
  <link rel="stylesheet" href="../../assets/css/p2p.css">
</head>
<body>

  <header class="app-header">
    <div class="container app-header-inner">
      <a href="../dashboard.html" class="app-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="app-brand-text">ARYANA<small>CURRENCY</small></div>
      </a>
      <nav class="app-nav">
        <a href="../dashboard.html" class="app-nav-link"><span>Dashboard</span></a>
        <a href="../exchange.html" class="app-nav-link"><span>Trade</span></a>
        <a href="index.html" class="app-nav-link active"><span>P2P</span></a>
        <a href="../orders.html" class="app-nav-link"><span>Orders</span></a>
        <a href="../profile.html" class="app-nav-link"><span>Profile</span></a>
      </nav>
      <div class="app-header-actions">
        <button class="icon-btn" id="themeToggle" title="Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="../profile.html" class="user-avatar-btn">
          <div class="user-avatar" id="userAvatar">A</div>
          <span class="user-name" id="userName">User</span>
        </a>
        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container p2p-main">
    <div class="p2p-page-header">
      <a href="index.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div>
        <h1>My Ads</h1>
        <p>Your active and past listings</p>
      </div>
    </div>

    <div class="p2p-actions-row">
      <a href="my-orders.html" class="p2p-filter-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        My Orders
      </a>
      <a href="create-ad.html" class="p2p-create-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Ad
      </a>
    </div>

    <div id="myAdsContainer">
      <div class="p2p-loading"><div class="p2p-spinner"></div><span>Loading your ads...</span></div>
    </div>
  </main>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/p2p.js"></script>
  <script src="../../assets/js/footer.js"></script>
  <script src="../../assets/js/pwa.js"></script>
</body>
</html>
