<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Withdrawals Management — Aryana Currency Admin">
  <meta name="theme-color" content="#0B0E11">

  <title>Withdrawals | Admin — ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
</head>
<body data-admin-page="withdrawals">

  <!-- Admin Topbar -->
  <header class="admin-topbar">
    <div class="admin-topbar-inner">

      <a href="index.html" class="admin-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="admin-brand-text">
          ARYANA
          <small>ADMIN PANEL</small>
        </div>
      </a>

      <div class="admin-topbar-actions">
        <a href="../dashboard.html" class="icon-btn" title="Back to site">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>

        <button class="icon-btn" id="refreshBtn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>

        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Admin Layout -->
  <div class="admin-layout">

    <!-- Sidebar (auto) -->
    <aside class="admin-sidebar"></aside>

    <!-- Main -->
    <main class="admin-main">

      <!-- Page Header -->
      <div class="admin-page-header">
        <h1>Withdrawals</h1>
        <p>Review and process withdrawal requests</p>
      </div>

      <!-- Stats Grid -->
      <div class="admin-stats-grid">
        <div class="admin-stat-card blue">
          <div class="admin-stat-header">
            <div class="admin-stat-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"/>
                <line x1="8" y1="12" x2="21" y2="12"/>
                <line x1="8" y1="18" x2="21" y2="18"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statTotal">—</div>
          <div class="admin-stat-label">Total Withdrawals</div>
        </div>

        <div class="admin-stat-card gold">
          <div class="admin-stat-header">
            <div class="admin-stat-icon gold">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statPending">—</div>
          <div class="admin-stat-label">Pending</div>
        </div>

        <div class="admin-stat-card green">
          <div class="admin-stat-header">
            <div class="admin-stat-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statCompleted">—</div>
          <div class="admin-stat-label">Completed</div>
        </div>

        <div class="admin-stat-card red">
          <div class="admin-stat-header">
            <div class="admin-stat-icon red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statRejected">—</div>
          <div class="admin-stat-label">Rejected</div>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="admin-filter-bar">
        <select class="field-input" id="statusFilter" style="max-width: 220px;">
          <option value="">All Statuses</option>
          <option value="PENDING">Pending</option>
          <option value="PROCESSING">Processing</option>
          <option value="COMPLETED">Completed</option>
          <option value="REJECTED">Rejected</option>
          <option value="CANCELLED">Cancelled</option>
        </select>
      </div>

      <!-- Loading -->
      <div id="loadingBox" class="admin-empty">
        <div class="spinner spinner-lg" style="color: var(--gold); margin: 0 auto;"></div>
      </div>

      <!-- Content -->
      <div id="contentBox" style="display:none;">

        <!-- Empty -->
        <div class="admin-empty" id="emptyBox" style="display:none;">
          <div class="admin-empty-icon">◇</div>
          <h3>No withdrawals found</h3>
          <p>Try a different filter.</p>
        </div>

        <!-- Table -->
        <div class="admin-table-wrap" id="tableWrap">
          <table class="admin-table" id="withdrawalsTable">
            <thead>
              <tr>
                <th>Reference</th>
                <th>User</th>
                <th>Amount</th>
                <th>Destination</th>
                <th>Status</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="withdrawalsBody"></tbody>
          </table>
        </div>

      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/admin-v2/common.js"></script>
  <script src="../../assets/js/admin-v2/withdrawals.js"></script>
</body>
</html>
