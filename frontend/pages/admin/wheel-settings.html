<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rewards Wheel Settings — Aryana Currency Admin">
  <meta name="theme-color" content="#1E40AF">
<link rel="manifest" href="/manifest-admin.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARYANA Admin">
<link rel="apple-touch-icon" href="/assets/images/icon-192.png">

  <title>Rewards Wheel | Admin — ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-fix.css">
  <link rel="stylesheet" href="../../assets/css/wheel-admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
</head>
<body data-admin-page="wheel">

  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="index.html" class="admin-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="admin-brand-text">
          ARYANA
          <small>ADMIN PANEL</small>
        </div>
      </a>
      <div class="admin-topbar-actions">
        <a href="../dashboard.html" class="icon-btn" title="Back to site">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <button type="button" class="icon-btn" id="refreshBtn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-page-header">
        <h1>Rewards Wheel</h1>
        <p>Configure prizes, probabilities, and tickets</p>
      </div>

      <div id="loadingBox" class="admin-empty">
        <div class="spinner spinner-lg" style="margin: 0 auto;"></div>
      </div>

      <div id="contentBox" style="display:none;">

        <div class="admin-stats-grid">
          <div class="admin-stat-card blue">
            <div class="admin-stat-header">
              <div class="admin-stat-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
                </svg>
              </div>
            </div>
            <div class="admin-stat-value" id="statTotalSpins">—</div>
            <div class="admin-stat-label">Total Spins</div>
          </div>

          <div class="admin-stat-card gold">
            <div class="admin-stat-header">
              <div class="admin-stat-icon gold">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="6" width="20" height="12" rx="2"/>
                  <path d="M2 10h20M6 15h.01M10 15h.01"/>
                </svg>
              </div>
            </div>
            <div class="admin-stat-value" id="statTicketsSold">—</div>
            <div class="admin-stat-label">Tickets Sold</div>
          </div>

          <div class="admin-stat-card green">
            <div class="admin-stat-header">
              <div class="admin-stat-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="1" x2="12" y2="23"/>
                  <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
              </div>
            </div>
            <div class="admin-stat-value" id="statTotalPaid">—</div>
            <div class="admin-stat-label">Total Paid (AFN)</div>
          </div>

          <div class="admin-stat-card red">
            <div class="admin-stat-header">
              <div class="admin-stat-icon red">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
            </div>
            <div class="admin-stat-value" id="statPending">—</div>
            <div class="admin-stat-label">Pending Approval</div>
          </div>
        </div>

        <div class="settings-tabs">
          <button type="button" class="settings-tab active" data-tab="settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </button>
          <button type="button" class="settings-tab" data-tab="prizes">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            Prizes
          </button>
        </div>

        <div class="settings-panel active" id="panelSettings">

          <div class="admin-detail-card">
            <div class="admin-detail-card-title">
              General Settings
            </div>

            <div class="settings-grid">
              <div class="field">
                <label class="field-label">Wheel Enabled</label>
                <label class="switch">
                  <input type="checkbox" id="setIsEnabled">
                  <span class="slider"></span>
                </label>
              </div>

              <div class="field">
                <label class="field-label" for="setTicketPrice">Ticket Price (AFN)</label>
                <input type="number" id="setTicketPrice" class="field-input" step="1" min="0">
              </div>

              <div class="field">
                <label class="field-label" for="setTicketExpiry">Ticket Expiry (days)</label>
                <input type="number" id="setTicketExpiry" class="field-input" step="1" min="1">
              </div>

              <div class="field">
                <label class="field-label" for="setMaxSpins">Max Spins / Day</label>
                <input type="number" id="setMaxSpins" class="field-input" step="1" min="1">
              </div>

              <div class="field">
                <label class="field-label" for="setMinInterval">Min Interval (sec)</label>
                <input type="number" id="setMinInterval" class="field-input" step="1" min="1">
              </div>

              <div class="field">
                <label class="field-label">Sound Enabled</label>
                <label class="switch">
                  <input type="checkbox" id="setSoundEnabled">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div class="admin-detail-card">
            <div class="admin-detail-card-title">
              Free Ticket Sources
            </div>

            <div class="settings-grid">
              <div class="field">
                <label class="field-label">Signup + KYC</label>
                <label class="switch">
                  <input type="checkbox" id="setTicketOnKyc">
                  <span class="slider"></span>
                </label>
              </div>

              <div class="field">
                <label class="field-label" for="setTicketOnKycCount">Tickets per Signup+KYC</label>
                <input type="number" id="setTicketOnKycCount" class="field-input" step="1" min="1">
              </div>

              <div class="field">
                <label class="field-label">Successful Trade</label>
                <label class="switch">
                  <input type="checkbox" id="setTicketOnTrade">
                  <span class="slider"></span>
                </label>
              </div>

              <div class="field">
                <label class="field-label" for="setTicketOnTradeCount">Tickets per Trade</label>
                <input type="number" id="setTicketOnTradeCount" class="field-input" step="1" min="1">
              </div>

              <div class="field">
                <label class="field-label">Ticket Purchase Enabled</label>
                <label class="switch">
                  <input type="checkbox" id="setPurchaseEnabled">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <div class="admin-detail-card">
            <div class="admin-detail-card-title">
              Animation & Security
            </div>

            <div class="settings-grid">
              <div class="field">
                <label class="field-label" for="setAnimDuration">Animation Duration (sec)</label>
                <input type="number" id="setAnimDuration" class="field-input" step="0.1" min="3" max="15">
              </div>

              <div class="field">
                <label class="field-label" for="setNearJackpot">"Near Jackpot" Chance (%)</label>
                <input type="number" id="setNearJackpot" class="field-input" step="1" min="0" max="100">
              </div>

              <div class="field">
                <label class="field-label" for="setNearMin">Near Offset Min</label>
                <input type="number" id="setNearMin" class="field-input" step="1" min="0">
              </div>

              <div class="field">
                <label class="field-label" for="setNearMax">Near Offset Max</label>
                <input type="number" id="setNearMax" class="field-input" step="1" min="1">
              </div>

              <div class="field">
                <label class="field-label" for="setApprovalAbove">Approval Required Above (AFN)</label>
                <input type="number" id="setApprovalAbove" class="field-input" step="1" min="0">
              </div>

              <div class="field">
                <label class="field-label" for="setMaxBigPrize">Max Big Prize / Day</label>
                <input type="number" id="setMaxBigPrize" class="field-input" step="1" min="1">
              </div>
            </div>
          </div>

          <div class="settings-actions">
            <button type="button" class="admin-btn gold" id="saveSettingsBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              Save Settings
            </button>
          </div>
        </div>

        <div class="settings-panel" id="panelPrizes">

          <div class="prizes-header">
            <div>
              <h2>Wheel Prizes</h2>
              <p class="prizes-subtitle">
                Total Probability: <strong id="totalProb" class="prob-total">0%</strong>
                <span id="probStatus"></span>
              </p>
            </div>
            <button type="button" class="admin-btn gold" id="addPrizeBtn">
              + Add Prize
            </button>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Icon</th>
                  <th>Label</th>
                  <th>Type</th>
                  <th>Amount</th>
                  <th>Probability</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="prizesBody"></tbody>
            </table>
          </div>

        </div>

      </div>

    </main>
  </div>

  <div class="modal-overlay" id="prizeModal" style="display:none;">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="prizeModalTitle">Add Prize</h3>
        <button type="button" class="modal-close" id="closePrizeModal">×</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="prizeId">

        <div class="settings-grid">
          <div class="field">
            <label class="field-label">Type</label>
            <select id="prizeType" class="field-input">
              <option value="cash">Cash</option>
              <option value="ticket">Ticket</option>
              <option value="empty">Empty</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label">Sort Order</label>
            <input type="number" id="prizeSortOrder" class="field-input" step="1" min="0">
          </div>

          <div class="field">
            <label class="field-label">Icon (emoji or leave empty)</label>
            <input type="text" id="prizeIcon" class="field-input" maxlength="4" placeholder="">
          </div>

          <div class="field">
            <label class="field-label">Color</label>
            <input type="color" id="prizeColor" class="field-input color-input" value="#FFD700">
          </div>

          <div class="field full-width">
            <label class="field-label">Label (EN)</label>
            <input type="text" id="prizeLabel" class="field-input" placeholder="1000">
          </div>

          <div class="field">
            <label class="field-label">Amount (AFN)</label>
            <input type="number" id="prizeAmount" class="field-input" step="1" min="0">
          </div>

          <div class="field">
            <label class="field-label">Ticket Count (for ticket type)</label>
            <input type="number" id="prizeTicketCount" class="field-input" step="1" min="0">
          </div>

          <div class="field">
            <label class="field-label">Probability (%)</label>
            <input type="number" id="prizeProbability" class="field-input" step="0.0001" min="0" max="100">
          </div>

          <div class="field">
            <label class="field-label">Max Wins / Day (optional)</label>
            <input type="number" id="prizeMaxDay" class="field-input" step="1" min="0" placeholder="unlimited">
          </div>

          <div class="field">
            <label class="field-label">Max Wins / User (optional)</label>
            <input type="number" id="prizeMaxUser" class="field-input" step="1" min="0" placeholder="unlimited">
          </div>

          <div class="field">
            <label class="field-label">Active</label>
            <label class="switch">
              <input type="checkbox" id="prizeIsActive" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelPrizeBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="savePrizeBtn">Save Prize</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/admin-v2/common.js"></script>
  <script src="../../assets/js/admin-v2/wheel-settings.js"></script>
<script src="../../assets/js/admin-pwa.js"></script>
</body>
</html>
