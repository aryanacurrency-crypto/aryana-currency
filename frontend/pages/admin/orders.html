<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage orders — Aryana Currency Admin">
  <meta name="theme-color" content="#0B0E11">

  <title>Orders | Admin — ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
</head>
<body data-admin-page="orders">

  <!-- Admin Topbar -->
  <header class="admin-topbar">
    <div class="admin-topbar-inner">

      <a href="index.html" class="admin-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="admin-brand-text">
          ARYANA
          <small>ADMIN PANEL</small>
        </div>
      </a>

      <div class="admin-topbar-actions">
        <a href="../dashboard.html" class="icon-btn" title="Back to site">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>

        <button class="icon-btn" id="refreshBtn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>

        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Admin Layout -->
  <div class="admin-layout">

    <!-- Sidebar (auto-rendered by common.js) -->
    <aside class="admin-sidebar"></aside>

    <!-- Main -->
    <main class="admin-main">

      <!-- Page Header -->
      <div class="admin-page-header">
        <h1>All Orders</h1>
        <p>Review, verify, and complete user orders</p>
      </div>

      <!-- Filter Bar -->
      <div class="admin-filter-bar">
        <input type="text" class="field-input" id="searchInput" placeholder="Search by reference or email...">
        <select class="field-input" id="statusFilter" style="max-width: 200px;">
          <option value="">All Statuses</option>
          <option value="PENDING">Pending</option>
          <option value="AWAITING_REVIEW">In Review</option>
          <option value="PROCESSING">Processing</option>
          <option value="COMPLETED">Completed</option>
          <option value="CANCELLED">Cancelled</option>
          <option value="REJECTED">Rejected</option>
        </select>
        <select class="field-input" id="sideFilter" style="max-width: 160px;">
          <option value="">All Types</option>
          <option value="BUY">Buy</option>
          <option value="SELL">Sell</option>
        </select>
      </div>

      <!-- Loading -->
      <div id="loadingBox" class="admin-empty">
        <div class="spinner spinner-lg" style="color: var(--gold); margin: 0 auto;"></div>
      </div>

      <!-- Content -->
      <div id="contentBox" style="display:none;">

        <!-- Empty -->
        <div class="admin-empty" id="emptyBox" style="display:none;">
          <div class="admin-empty-icon">◇</div>
          <h3>No orders found</h3>
          <p>Try a different filter.</p>
        </div>

        <!-- Table -->
        <div class="admin-table-wrap" id="tableWrap">
          <table class="admin-table" id="ordersTable">
            <thead>
              <tr>
                <th>Reference</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>

      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/admin-v2/common.js"></script>
  <script src="../../assets/js/admin-v2/orders.js"></script>
</body>
</html>
