<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="P2P Orders — Aryana Currency Admin">
  <meta name="theme-color" content="#1E40AF">
<link rel="manifest" href="/manifest-admin.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ARYANA Admin">
<link rel="apple-touch-icon" href="/assets/images/icon-192.png">
  <title>P2P Orders | Admin — ARYANA CURRENCY</title>
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-fix.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
  <link rel="stylesheet" href="../../assets/css/p2p.css">
</head>
<body data-admin-page="p2p-orders">

  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="index.html" class="admin-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="admin-brand-text">
          ARYANA
          <small>ADMIN PANEL</small>
        </div>
      </a>
      <div class="admin-topbar-actions">
        <a href="../dashboard.html" class="icon-btn" title="Back to site">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <button type="button" class="icon-btn" id="refreshBtn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="admin-page-header">
        <h1>P2P Orders</h1>
        <p>Traders By Traders — direct trade orders</p>
      </div>

      <div class="settings-tabs" style="margin-bottom:20px;">
        <button type="button" class="settings-tab active" data-filter="PAYMENT_REVIEW">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Pending Review
          <span class="count-badge" id="countPendingReview" style="margin-inline-start:6px;">0</span>
        </button>
        <button type="button" class="settings-tab" data-filter="DISPUTED">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Disputed
          <span class="count-badge red" id="countDisputed" style="margin-inline-start:6px;">0</span>
        </button>
        <button type="button" class="settings-tab" data-filter="all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          All Orders
        </button>
      </div>

      <div id="loadingBox" class="admin-empty">
        <div class="spinner spinner-lg" style="margin: 0 auto;"></div>
      </div>

      <div id="contentBox" style="display:none;">
        <div class="admin-table-wrap">
          <div class="admin-empty" id="ordersEmpty" style="display:none;">
            <div class="admin-empty-icon">✓</div>
            <h3>No orders</h3>
            <p>Nothing to show here</p>
          </div>
          <table class="admin-table" id="ordersTable" style="display:none;">
            <thead>
              <tr>
                <th>Reference</th>
                <th>Buyer</th>
                <th>Seller</th>
                <th>Amount</th>
                <th>Total (AFN)</th>
                <th>Status</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/admin-v2/common.js"></script>
  <script src="../../assets/js/admin-v2/p2p-orders.js"></script>
<script src="../../assets/js/admin-pwa.js"></script>
</body>
</html>
