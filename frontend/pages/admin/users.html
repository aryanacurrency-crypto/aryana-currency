﻿<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Users Management — Aryana Currency Admin">
  <meta name="theme-color" content="#0B0E11">

  <title>Users | Admin — ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../../assets/css/dashboard-v2.css">
  <link rel="stylesheet" href="../../assets/css/admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/wheel-admin-v2.css">
  <link rel="stylesheet" href="../../assets/css/notifications.css">
</head>
<body data-admin-page="users">

  <!-- Admin Topbar -->
  <header class="admin-topbar">
    <div class="admin-topbar-inner">

      <a href="index.html" class="admin-brand">
        <img src="../../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="admin-brand-text">
          ARYANA
          <small>ADMIN PANEL</small>
        </div>
      </a>

      <div class="admin-topbar-actions">
        <a href="../dashboard.html" class="icon-btn" title="Back to site">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>

        <button class="icon-btn" id="refreshBtn" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>

        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Admin Layout -->
  <div class="admin-layout">

    <!-- Sidebar (auto) -->
    <aside class="admin-sidebar"></aside>

    <!-- Main -->
    <main class="admin-main">

      <!-- Page Header -->
      <div class="admin-page-header">
        <h1>Users</h1>
        <p>Manage all registered users</p>
      </div>

      <!-- Stats Grid -->
      <div class="admin-stats-grid">
        <div class="admin-stat-card blue">
          <div class="admin-stat-header">
            <div class="admin-stat-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statTotal">—</div>
          <div class="admin-stat-label">Total Users</div>
        </div>

        <div class="admin-stat-card green">
          <div class="admin-stat-header">
            <div class="admin-stat-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statActive">—</div>
          <div class="admin-stat-label">Active</div>
        </div>

        <div class="admin-stat-card red">
          <div class="admin-stat-header">
            <div class="admin-stat-icon red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statDisabled">—</div>
          <div class="admin-stat-label">Disabled</div>
        </div>

        <div class="admin-stat-card gold">
          <div class="admin-stat-header">
            <div class="admin-stat-icon gold">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 12l2 2 4-4"/>
                <path d="M21 12c0 5-3.5 8.5-9 10-5.5-1.5-9-5-9-10V5l9-3 9 3z"/>
              </svg>
            </div>
          </div>
          <div class="admin-stat-value" id="statVerified">—</div>
          <div class="admin-stat-label">KYC Verified</div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="admin-filter-bar">
        <input
          type="text"
          class="field-input"
          id="searchInput"
          placeholder="Search by name, email, or phone..."
        >
      </div>

      <!-- Loading -->
      <div id="loadingBox" class="admin-empty">
        <div class="spinner spinner-lg" style="color: var(--gold); margin: 0 auto;"></div>
      </div>

      <!-- Content -->
      <div id="contentBox" style="display:none;">

        <!-- Empty -->
        <div class="admin-empty" id="emptyBox" style="display:none;">
          <div class="admin-empty-icon">◇</div>
          <h3>No users found</h3>
          <p>Try a different search term.</p>
        </div>

        <!-- Table -->
        <div class="admin-table-wrap" id="tableWrap">
          <table class="admin-table" id="usersTable">
            <thead>
              <tr>
                <th>User</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>KYC</th>
                <th>Status</th>
                <th>Joined</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>

      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/admin-v2/common.js"></script>
  <script src="../../assets/js/admin-v2/users.js"></script>
</body>
</html>
