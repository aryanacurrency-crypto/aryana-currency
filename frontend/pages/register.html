﻿<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Aryana Currency account.">
  <meta name="theme-color" content="#0A0612">

  <title>Register | ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../assets/css/auth-v2.css">
  <link rel="stylesheet" href="../assets/css/notifications.css">
</head>
<body>

  <div class="auth-page">

    <!-- Background -->
    <div class="auth-bg">
      <div class="auth-bg-glow glow-1"></div>
      <div class="auth-bg-glow glow-2"></div>
      <div class="auth-bg-grid"></div>
    </div>

    <!-- Back -->
    <a href="../index.html" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      <span>Back to Home</span>
    </a>

    <!-- Container -->
    <main class="auth-container">

      <!-- Brand -->
      <div class="auth-brand">
        <img src="../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="auth-brand-text">
          ARYANA
          <small>CURRENCY</small>
        </div>
      </div>

      <!-- Card -->
      <section class="auth-card">

        <div class="auth-heading">
          <div class="auth-badge">
            <span class="auth-badge-dot"></span>
            Start Trading Today
          </div>

          <h1>Create <span>Account.</span></h1>

          <p>Join Aryana Currency and start exchanging USDT ↔ AFN safely.</p>
        </div>

        <div class="auth-message error" id="errorBox"></div>

        <form class="auth-form" id="registerForm" autocomplete="on" novalidate>

          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input
                type="text"
                id="fullName"
                class="form-input"
                placeholder="Ahmad Rahimi"
                autocomplete="name"
                required
              >
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <!-- Country + Phone -->
          <div class="form-grid">

            <div class="form-group">
              <label class="form-label" for="country">Country</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                  </svg>
                </span>
                <select id="country" class="form-input" required>
                  <option value="">Select Country</option>
                  <option value="Afghanistan">Afghanistan</option>
                  <option value="Iran">Iran</option>
                  <option value="Pakistan">Pakistan</option>
                  <option value="Tajikistan">Tajikistan</option>
                  <option value="Uzbekistan">Uzbekistan</option>
                  <option value="Turkmenistan">Turkmenistan</option>
                  <option value="Turkey">Turkey</option>
                  <option value="UAE">United Arab Emirates</option>
                  <option value="Saudi Arabia">Saudi Arabia</option>
                  <option value="Qatar">Qatar</option>
                  <option value="India">India</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Phone Number</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                </span>
                <input
                  type="tel"
                  id="phone"
                  class="form-input"
                  placeholder="+93 700 000 000"
                  autocomplete="tel"
                  required
                >
              </div>
            </div>

          </div>

          <!-- Referral Code -->
          <div class="referral-field">
            <div class="referral-label">
              <span style="display:flex; align-items:center; gap:8px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="8.5" cy="7" r="4"/>
                  <line x1="20" y1="8" x2="20" y2="14"/>
                  <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
                Referral / Partner Code
              </span>
              <span class="referral-optional">Optional</span>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="text"
                id="referralCode"
                class="form-input referral-input"
                placeholder="ALI123"
                maxlength="20"
                autocomplete="off"
              >
              <span class="referral-status" id="referralStatus"></span>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
              >
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="passwordConfirm">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="passwordConfirm"
                class="form-input"
                placeholder="Repeat password"
                autocomplete="new-password"
                minlength="8"
                required
              >
              <button type="button" class="password-toggle" id="passwordConfirmToggle" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Password Strength -->
          <div class="password-strength" id="passwordStrength" style="display:none;">
            <div class="strength-bars">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <span class="strength-text">Strength</span>
          </div>

          <!-- Terms -->
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" required>
            <span class="custom-checkbox"></span>
            <span>I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></span>
          </label>

          <!-- Submit -->
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="btn-text">Create Account</span>
            <span class="btn-loader"></span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>

        </form>

        <div class="auth-switch">
          <span>Already have an account?</span>
          <a href="login.html">Sign In</a>
        </div>

      </section>

      <!-- Footer -->
      <div class="auth-footer">
        <span>© <span id="currentYear"></span> ARYANA CURRENCY</span>
        <span class="separator">•</span>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </div>

    </main>

  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/form-helpers.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
