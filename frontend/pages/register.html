<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Create Account — Aryana Currency">
  <meta name="theme-color" content="#FAFBFF">

  <title>Register | ARYANA CURRENCY</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aryana_theme') || 'light';
        document.documentElement.classList.add(saved);
        document.documentElement.setAttribute('data-theme', saved);
        setTimeout(function () {
          document.documentElement.classList.add('theme-ready');
        }, 50);
      } catch (e) {}
    })();
  </script>

  <link rel="manifest" href="../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aryana">
  <link rel="apple-touch-icon" href="../assets/images/icon-192.png">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../assets/css/notifications.css">
  <link rel="stylesheet" href="../assets/css/auth-v2.css">
</head>
<body class="auth-body">

  <div class="auth-card">

    <!-- ═══════════════════════════════════════
         BRAND HEADER
         ═══════════════════════════════════════ -->
    <div class="auth-brand">
      <a href="../index.html" class="auth-brand-logo">
        <img src="../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="auth-brand-logo-text">
          <strong>ARYANA</strong>
          <small>CURRENCY</small>
        </div>
      </a>

      <div class="auth-badge">
        <span class="auth-badge-dot"></span>
        <span>Start Trading Today</span>
      </div>

      <h1 class="auth-title">
        Create <span class="highlight">Account</span>
      </h1>
      <p class="auth-subtitle">
        Join Aryana Currency and start exchanging USDT ↔ AFN safely.
      </p>
    </div>

    <!-- ═══════════════════════════════════════
         FORM
         ═══════════════════════════════════════ -->
    <div class="auth-form-wrap">

      <!-- Error Box -->
      <div class="auth-alert auth-alert-error" id="errorBox" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText">Something went wrong</span>
      </div>

      <form class="auth-form" id="registerForm">

        <div class="auth-field">
          <label class="auth-label" for="fullName">Full Name</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="fullName" class="auth-input" placeholder="Ahmad Rahimi" autocomplete="name" required>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="email">Email Address</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="auth-field-row">
          <div class="auth-field">
            <label class="auth-label" for="country">Country</label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <select id="country" class="auth-select">
                <option value="AF">🇦🇫 Afghanistan</option>
                <option value="IR">🇮🇷 Iran</option>
                <option value="PK">🇵🇰 Pakistan</option>
                <option value="TJ">🇹🇯 Tajikistan</option>
                <option value="AE">🇦🇪 UAE</option>
                <option value="OTHER">🌍 Other</option>
              </select>
            </div>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="phone">Phone Number</label>
            <div class="auth-input-wrap">
              <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
              <input type="tel" id="phone" class="auth-input" placeholder="+93 700 000 000" autocomplete="tel" required>
            </div>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="referral">
            <span>Referral Code</span>
            <span class="auth-label-hint">Optional</span>
          </label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            <input type="text" id="referral" class="auth-input" placeholder="ALT123" autocomplete="off">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" class="auth-input" placeholder="At least 8 characters" autocomplete="new-password" required>
            <button type="button" class="auth-input-toggle" id="togglePassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="confirmPassword">Confirm Password</label>
          <div class="auth-input-wrap">
            <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="confirmPassword" class="auth-input" placeholder="Repeat password" autocomplete="new-password" required>
            <button type="button" class="auth-input-toggle" id="toggleConfirmPassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="auth-checkbox-wrap">
          <input type="checkbox" id="agreeTerms" required>
          <span class="auth-checkbox"></span>
          <span>
            I agree to the <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy</a>
          </span>
        </label>

        <button type="submit" class="auth-submit-btn" id="submitBtn">
          <span>Create Account</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </form>
    </div>

    <!-- ═══════════════════════════════════════
         FOOTER
         ═══════════════════════════════════════ -->
    <div class="auth-footer">
      <div class="auth-footer-text">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>

  </div>

  <!-- Legal -->
  <div class="auth-legal">
    <span>© 2026 ARYANA CURRENCY</span>
    <span>·</span>
    <a href="terms.html">Terms</a>
    <span>·</span>
    <a href="privacy.html">Privacy</a>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/register.js"></script>
</body>
</html>
