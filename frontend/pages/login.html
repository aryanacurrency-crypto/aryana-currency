﻿<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your Aryana Currency account.">
  <meta name="theme-color" content="#0A0612">

  <title>Login | ARYANA CURRENCY</title>

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/theme-v2.css">
  <link rel="stylesheet" href="../assets/css/ui-v2.css">
  <link rel="stylesheet" href="../assets/css/auth-v2.css">
  <link rel="stylesheet" href="../assets/css/notifications.css">
</head>
<body>

  <div class="auth-page">

    <!-- Background -->
    <div class="auth-bg">
      <div class="auth-bg-glow glow-1"></div>
      <div class="auth-bg-glow glow-2"></div>
      <div class="auth-bg-grid"></div>
    </div>

    <!-- Back -->
    <a href="../index.html" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      <span>Back to Home</span>
    </a>

    <!-- Container -->
    <main class="auth-container">

      <!-- Brand -->
      <div class="auth-brand">
        <img src="../assets/images/logo.png" alt="ARYANA CURRENCY">
        <div class="auth-brand-text">
          ARYANA
          <small>CURRENCY</small>
        </div>
      </div>

      <!-- Card -->
      <section class="auth-card">

        <div class="auth-heading">
          <div class="auth-badge">
            <span class="auth-badge-dot"></span>
            Secure Access
          </div>

          <h1>Welcome <span>Back.</span></h1>

          <p>Sign in to access your exchange dashboard, wallet and orders.</p>
        </div>

        <div class="auth-message error" id="errorBox"></div>

        <form class="auth-form" id="loginForm" autocomplete="on">

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="form-label">
              <span>Password</span>
              <a href="forgot-password.html">Forgot?</a>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter your password"
                autocomplete="current-password"
                minlength="8"
                required
              >
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember -->
          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe">
              <span class="custom-checkbox"></span>
              <span>Remember me</span>
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader"></span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>

        </form>

        <div class="auth-switch">
          <span>Don't have an account?</span>
          <a href="register.html">Create Account</a>
        </div>

      </section>

      <!-- Footer -->
      <div class="auth-footer">
        <span>© <span id="currentYear"></span> ARYANA CURRENCY</span>
        <span class="separator">•</span>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </div>

    </main>

  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/form-helpers.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
